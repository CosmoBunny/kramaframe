[workspace]
members = [
    ".",
    "examples/nostd",
]

[package]
name = "kramaframe"
version = "0.2.3"
edition = "2024"
readme = "README.md"
description = "A simple, generic, and flexible keyframe animation library for Rust."
repository = "https://github.com/CosmoBunny/kramaframe.git"
license = "MIT"
keywords = ["animation", "keyframe", "easing", "tweening", "timeline"]
categories = ["multimedia::images", "game-development"]

[features]
alloc = []
default = ["std"]
std = []

[dependencies]
libm = { version = "0.2" }

[dev-dependencies]
ratatui = { version = "0.29.0" }
cand = "0.3.1"
crossterm = "0.29.0"
cpal = "0.15"
ringbuf = "0.3"
rustfft = "6.2"
num-complex = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = false

[package]
name = "kramaframe"
version = "0.1.7"
edition = "2024"
readme = "README.md"
description = "A simple, generic, and flexible keyframe animation library for Rust."
repository = "https://github.com/CosmoBunny/kramaframe.git"
license = "MIT"
keywords = ["animation", "keyframe", "easing", "tweening", "timeline"]
categories = ["multimedia::images", "game-development"]

[features]
# Future features
# gpu_accn = []
# no_std = []
# alloc = []
default = []

[dependencies]

[dev-dependencies]
ratatui = { version = "0.29.0" }
cand = "0.3.1"
crossterm = "0.29.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = false
